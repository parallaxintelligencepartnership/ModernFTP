name: release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Build and package only, do not create a GitHub release"
        type: boolean
        default: true

permissions:
  contents: read

jobs:
  release:
    runs-on: windows-2025
    timeout-minutes: 45
    permissions:
      contents: write
    env:
      DOTNET_CLI_TELEMETRY_OPTOUT: "1"
      DOTNET_NOLOGO: "1"
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: 10.0.x

      - name: Read the version and check the tag
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          [xml]$props = Get-Content Directory.Build.props
          $version = ($props.Project.PropertyGroup | Where-Object { $_.Version } | Select-Object -First 1).Version
          if (-not $version) { throw 'No Version found in Directory.Build.props.' }
          if ($env:GITHUB_REF_TYPE -eq 'tag' -and $env:GITHUB_REF_NAME -ne "v$version") {
            throw "Tag $($env:GITHUB_REF_NAME) does not equal v$version from Directory.Build.props."
          }
          "VERSION=$version" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          Write-Host "Version $version"

      - name: Restore (locked)
        run: dotnet restore ModernFTP.sln --locked-mode

      - name: Build
        run: dotnet build ModernFTP.sln -c Release --no-restore

      - name: Test
        run: dotnet test ModernFTP.sln -c Release --no-build

      - name: Publish framework dependent
        shell: pwsh
        # The single file analyzer pulls in Microsoft.NET.ILLink.Tasks at the SDK's own patch version,
        # which would break locked restore whenever the runner SDK moves; it is off for publish only.
        run: |
          $ErrorActionPreference = 'Stop'
          foreach ($p in 'ModernFTP.App', 'ModernFTP.Host.Console', 'ModernFTP.Host.Service') {
            dotnet publish "src/$p/$p.csproj" -c Release -r win-x64 --self-contained false -p:PublishSingleFile=true -p:EnableSingleFileAnalyzer=false -p:RestoreLockedMode=true -o publish/fdd
            if ($LASTEXITCODE -ne 0) { throw "publish of $p failed" }
          }

      - name: Publish self contained (portable)
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          foreach ($p in 'ModernFTP.App', 'ModernFTP.Host.Console', 'ModernFTP.Host.Service') {
            dotnet publish "src/$p/$p.csproj" -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -p:EnableCompressionInSingleFile=true -p:EnableSingleFileAnalyzer=false -p:RestoreLockedMode=true -o publish/portable
            if ($LASTEXITCODE -ne 0) { throw "self contained publish of $p failed" }
          }

      - name: Package
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          foreach ($dir in 'publish/fdd', 'publish/portable') {
            Get-ChildItem $dir -Filter *.pdb | Remove-Item -Force
            foreach ($doc in 'README.md', 'LICENSE.md', 'NOTICE.md', 'CHANGELOG.md') { Copy-Item $doc $dir }
            foreach ($exe in 'ModernFTP.exe', 'modernftp.exe', 'modernftp-service.exe') {
              if (-not (Test-Path (Join-Path $dir $exe))) { throw "$exe is missing from $dir" }
            }
          }
          New-Item -ItemType File -Path publish/portable/portable | Out-Null
          Compress-Archive -Path 'publish/fdd/*' -DestinationPath "dist/ModernFTP-$($env:VERSION)-win-x64.zip"
          Compress-Archive -Path 'publish/portable/*' -DestinationPath "dist/ModernFTP-$($env:VERSION)-win-x64-portable.zip"
          Get-ChildItem dist -Filter *.zip | Sort-Object Name | ForEach-Object {
            "{0}  {1}" -f (Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLowerInvariant(), $_.Name
          } | Set-Content -Path dist/SHA256SUMS.txt -Encoding ascii
          Get-Content dist/SHA256SUMS.txt
          Get-ChildItem dist | ForEach-Object { "{0,-50} {1,14:N0} bytes" -f $_.Name, $_.Length }

      - name: Upload artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: modernftp-release-${{ env.VERSION }}
          path: dist
          if-no-files-found: error

      - name: Create the GitHub release
        if: ${{ github.ref_type == 'tag' && (github.event_name == 'push' || inputs.dry_run == false) }}
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = 'Stop'
          $text = Get-Content CHANGELOG.md -Raw
          $pattern = '(?ms)^## ' + [regex]::Escape($env:VERSION) + '\s*$(.*?)(?=^## |\z)'
          $m = [regex]::Match($text, $pattern)
          if (-not $m.Success -or -not $m.Groups[1].Value.Trim()) { throw "CHANGELOG.md has no section for $($env:VERSION)." }
          $notes = Join-Path $env:RUNNER_TEMP 'notes.md'
          Set-Content -Path $notes -Value $m.Groups[1].Value.Trim() -Encoding utf8
          gh release create $env:GITHUB_REF_NAME --title "ModernFTP $($env:VERSION)" --notes-file $notes `
            "dist/ModernFTP-$($env:VERSION)-win-x64.zip" "dist/ModernFTP-$($env:VERSION)-win-x64-portable.zip" dist/SHA256SUMS.txt
          if ($LASTEXITCODE -ne 0) { throw 'gh release create failed' }
